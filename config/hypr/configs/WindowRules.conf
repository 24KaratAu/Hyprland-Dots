# ===== FULL RESTORED TAG RULES =====

# browser
windowrule = match:class ^(firefox)$, tag +browser
windowrule = match:class ^(org.mozilla.firefox)$, tag +browser
windowrule = match:class ^(firefox-esr)$, tag +browser
windowrule = match:class ^(firefox-bin)$, tag +browser
windowrule = match:class ^(google-chrome)$, tag +browser
windowrule = match:class ^(google-chrome-beta)$, tag +browser
windowrule = match:class ^(google-chrome-dev)$, tag +browser
windowrule = match:class ^(chromium)$, tag +browser
windowrule = match:class ^(microsoft-edge)$, tag +browser
windowrule = match:class ^(brave-browser)$, tag +browser
windowrule = match:class ^(thorium-browser)$, tag +browser
windowrule = match:class ^(zen)$, tag +browser

# notif
windowrule = match:class ^(swaync-control-center)$, tag +notif
windowrule = match:class ^(swaync-notification-window)$, tag +notif
windowrule = match:class ^(swaync-client)$, tag +notif

# KooL
windowrule = match:title ^(KooL Quick Cheat Sheet)$, tag +KooL_Cheat
windowrule = match:title ^(KooL Hyprland Settings)$, tag +KooL_Settings
windowrule = match:class ^(nwg-displays)$, tag +KooL-Settings
windowrule = match:class ^(nwg-look)$, tag +KooL-Settings

# terminal
windowrule = match:class ^(kitty)$, tag +terminal
windowrule = match:class ^(kitty-dropterm)$, tag +terminal
windowrule = match:class ^(alacritty)$, tag +terminal

# email
windowrule = match:class ^(thunderbird)$, tag +email
windowrule = match:class ^(org.gnome.evolution)$, tag +email
windowrule = match:class ^(betterbird)$, tag +email

# projects
windowrule = match:class ^(codium)$, tag +projects
windowrule = match:class ^(vscodium)$, tag +projects
windowrule = match:class ^(code)$, tag +projects
windowrule = match:class ^(jetbrains)$, tag +projects

# screenshare
windowrule = match:class ^(com.obsproject.studio)$, tag +screenshare

# IM
windowrule = match:class ^(discord)$, tag +im
windowrule = match:class ^(vesktop)$, tag +im
windowrule = match:class ^(webcord)$, tag +im
windowrule = match:class ^(ferdium)$, tag +im
windowrule = match:class ^(whatsapp-for-linux)$, tag +im
windowrule = match:class ^(zapzap)$, tag +im
windowrule = match:class ^(telegram-desktop)$, tag +im
windowrule = match:class ^(teams-for-linux)$, tag +im
windowrule = match:class ^(element)$, tag +im

# games
windowrule = match:class ^(gamescope)$, tag +games
windowrule = match:class ^(steam_app_.*)$, tag +games

# gamestore
windowrule = match:class ^(steam)$, tag +gamestore
windowrule = match:title ^(lutris)$, tag +gamestore
windowrule = match:class ^(heroic)$, tag +gamestore

# file manager
windowrule = match:class ^(thunar)$, tag +file-manager
windowrule = match:class ^(org.gnome.nautilus)$, tag +file-manager
windowrule = match:class ^(pcmanfm-qt)$, tag +file-manager

# wallpaper
windowrule = match:class ^(waytrogen)$, tag +wallpaper

# multimedia
windowrule = match:class ^(audacious)$, tag +multimedia
windowrule = match:class ^(mpv)$, tag +multimedia_video
windowrule = match:class ^(vlc)$, tag +multimedia_video

# settings
windowrule = match:title ^(ROG Control)$, tag +settings
windowrule = match:class ^(wihotspot)$, tag +settings
windowrule = match:class ^(baobab)$, tag +settings
windowrule = match:class ^(gnome-disks)$, tag +settings
windowrule = match:title ^(Kvantum Manager)$, tag +settings
windowrule = match:class ^(file-roller)$, tag +settings
windowrule = match:class ^(nm-applet)$, tag +settings
windowrule = match:class ^(blueman-manager)$, tag +settings
windowrule = match:class ^(pavucontrol)$, tag +settings
windowrule = match:class ^(qt5ct)$, tag +settings
windowrule = match:class ^(qt6ct)$, tag +settings
windowrule = match:class ^(rofi)$, tag +settings

# viewer
windowrule = match:class ^(gnome-system-monitor)$, tag +viewer
windowrule = match:class ^(missioncenter)$, tag +viewer
windowrule = match:class ^(evince)$, tag +viewer
windowrule = match:class ^(eog)$, tag +viewer

# Some special override rules (Fixed corrupted linebreaks)
windowrule = match:tag multimedia_video*, no_blur 1
windowrule = match:tag multimedia_video*, opacity 1.0 override

# POSITION
windowrule = match:tag KooL_Cheat*, center 1
windowrule = match:class ([Tt]hunar), match:title negative:(.*[Tt]hunar.*), center 1
windowrule = match:title ^(ROG Control)$, center 1
windowrule = match:tag KooL-Settings*, center 1
windowrule = match:title ^(Keybindings)$, center 1
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$, center 1
windowrule = match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$, center 1
windowrule = match:class ^([Ff]erdium)$, center 1
windowrule = match:title ^(Picture-in-Picture)$, move 72% 7%

# windowrule to avoid idle for fullscreen apps
# REMOVED: idleinhibit was removed in Hyprland 0.53. Handled by hypridle now.

# FLOAT
windowrule = match:tag KooL_Cheat*, float 1
windowrule = match:tag wallpaper*, float 1
windowrule = match:tag settings*, float 1
windowrule = match:tag viewer*, float 1
windowrule = match:tag KooL-Settings*, float 1
windowrule = match:class ([Zz]oom|onedriver|onedriver-launcher)$, float 1
windowrule = match:class (org.gnome.Calculator), match:title (Calculator), float 1
windowrule = match:class ^(mpv|com.github.rafostar.Clapper)$, float 1
windowrule = match:class ^([Qq]alculate-gtk)$, float 1
windowrule = match:class ^([Ff]erdium)$, float 1
windowrule = match:title ^(Picture-in-Picture)$, float 1

# windowrule - float popups and dialogue
windowrule = match:title ^(Authentication Required)$, float 1
windowrule = match:title ^(Authentication Required)$, center 1
windowrule = match:class (codium|codium-url-handler|VSCodium), match:title negative:(.*codium.*|.*VSCodium.*), float 1
windowrule = match:class ^(com.heroicgameslauncher.hgl)$, match:title negative:(Heroic Games Launcher), float 1
windowrule = match:class ^([Ss]team)$, match:title negative:^([Ss]team)$, float 1
windowrule = match:class ([Tt]hunar), match:title negative:(.*[Tt]hunar.*), float 1

windowrule = match:title ^(Add Folder to Workspace)$, float 1
windowrule = match:title ^(Add Folder to Workspace)$, size 70% 60%
windowrule = match:title ^(Add Folder to Workspace)$, center 1

windowrule = match:title ^(Save As)$, float 1
windowrule = match:title ^(Save As)$, size 70% 60%
windowrule = match:title ^(Save As)$, center 1

windowrule = match:initial_title (Open Files), float 1
windowrule = match:initial_title (Open Files), size 70% 60%

windowrule = match:title ^(SDDM Background)$, float 1
windowrule = match:title ^(SDDM Background)$, center 1
windowrule = match:title ^(SDDM Background)$, size 16% 12%

# OPACITY
windowrule = match:tag browser*, opacity 0.99 0.8
windowrule = match:tag projects*, opacity 0.9 0.8
windowrule = match:tag im*, opacity 0.94 0.86
windowrule = match:tag multimedia*, opacity 0.94 0.86
windowrule = match:tag file-manager*, opacity 0.9 0.8
windowrule = match:tag terminal*, opacity 0.9 0.7
windowrule = match:tag settings*, opacity 0.8 0.7
windowrule = match:tag viewer*, opacity 0.82 0.75
windowrule = match:tag wallpaper*, opacity 0.9 0.7
windowrule = match:class ^(gedit|org.gnome.TextEditor|mousepad)$, opacity 0.8 0.7
windowrule = match:class ^(deluge)$, opacity 0.9 0.8
windowrule = match:class ^(seahorse)$, opacity 0.9 0.8
windowrule = match:title ^(Picture-in-Picture)$, opacity 0.95 0.75

# SIZE (Fixed corrupted linebreaks)
windowrule = match:tag KooL_Cheat*, size 65% 90%
windowrule = match:tag wallpaper*, size 70% 70%
windowrule = match:tag settings*, size 70% 70%
windowrule = match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$, size 60% 70%
windowrule = match:class ^([Ff]erdium)$, size 60% 70%

# PINNING
windowrule = match:title ^(Picture-in-Picture)$, pin 1

# extras
windowrule = match:title ^(Picture-in-Picture)$, keep_aspect_ratio 1

# BLUR & FULLSCREEN
windowrule = match:tag games*, no_blur 1
windowrule = match:tag games*, fullscreen 1
windowrule = match:class ^(jetbrains-*)$, no_initial_focus 1
windowrule = match:title ^(wind.*)$, no_initial_focus 1

# LAYER RULES (Strict Block Syntax)

layerrule {
    name = rofi_layer
    match:namespace = ^(rofi)$
    blur = true
    ignore_alpha = 0
}

layerrule {
    name = notifications_layer
    match:namespace = ^(notifications)$
    blur = true
    ignore_alpha = 0
}

layerrule {
    name = quickshell_layer
    match:namespace = ^(quickshell:overview)$
    blur = true
    # quickshell had both ignorezero and ignorealpha 0.5 in the old config.
    # ignore_alpha = 0.5 automatically covers both!
    ignore_alpha = 0.5 
}





























